<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0b0a14">
<title>X-Ray Body Mirror</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230b0a14'/%3E%3Cpath d='M22 18a6 6 0 1 1 8 5v18a6 6 0 1 1-8 5' stroke='%236ef2c4' stroke-width='5' fill='none' stroke-linecap='round'/%3E%3Cpath d='M42 46a6 6 0 1 1-8-5V23a6 6 0 1 1 8-5' stroke='%236ef2c4' stroke-width='5' fill='none' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="css/fonts.css">
<link rel="stylesheet" href="css/app.css">
</head>
<body class="ed-explore">
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-home" viewBox="0 0 24 24"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h5v-6h4v6h5V10"/></symbol>
  <symbol id="i-play" viewBox="0 0 24 24"><path d="M7 4.5v15l12-7.5z" fill="currentColor" stroke="none"/></symbol>
  <symbol id="i-menu" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></symbol>
  <symbol id="i-sound" viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9z"/><path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/></symbol>
  <symbol id="i-mute" viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9z"/><path d="M17 9l5 6M22 9l-5 6"/></symbol>
  <symbol id="i-bone" viewBox="0 0 24 24"><path d="M7.5 9.5l7 7"/><circle cx="6" cy="6.5" r="2.4"/><circle cx="9" cy="4.5" r="2.4"/><circle cx="15" cy="19.5" r="2.4"/><circle cx="18" cy="17" r="2.4"/></symbol>
  <symbol id="i-organ" viewBox="0 0 24 24"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/></symbol>
  <symbol id="i-blood" viewBox="0 0 24 24"><path d="M12 3s6 6.5 6 11a6 6 0 0 1-12 0c0-4.5 6-11 6-11z"/></symbol>
  <symbol id="i-star" viewBox="0 0 24 24"><path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1-4.4-4.3 6.1-.9z" fill="currentColor" stroke="none"/></symbol>
</svg>

<div id="stage">
  <video id="video" playsinline muted autoplay></video>
  <img id="photo" alt="">
  <canvas id="bones"></canvas>
  <canvas id="labels" aria-label="Body view"></canvas>
</div>

<header id="top">
  <button class="ic" id="homeBtn" data-i18n-aria="changeEdition"><svg class="i"><use href="#i-home"/></svg></button>
  <button class="chip hidden" id="learnBtn"><svg class="i" style="width:16px;height:16px"><use href="#i-play"/></svg><span class="lbl" data-i18n="lessons">Lessons</span></button>
  <div class="grow"></div>
  <button class="chip" id="langBtn" aria-label="Language">BM</button>
  <button class="ic" id="soundBtn" data-i18n-aria="sound"><svg class="i"><use href="#i-sound"/></svg></button>
  <button class="ic" id="menuBtn" data-i18n-aria="settings"><svg class="i"><use href="#i-menu"/></svg></button>
</header>
<div id="pill" role="status" aria-live="polite"></div>
<div id="lessons" class="pop"></div>
<input type="file" id="photoInput" accept="image/*" hidden>

<div id="panel" class="pop">
  <h3 data-i18n="picture">Picture</h3>
  <div class="row">
    <button class="btn" id="liveBtn" data-i18n="liveCam">Live camera</button>
    <button class="btn" id="photoBtn" data-i18n="myPhoto">Use my photo</button>
  </div>
  <div class="row">
    <button class="btn" id="rearBtn" data-i18n="rearCam">Rear camera</button>
    <button class="btn" id="freezeBtn" data-i18n="freeze">Freeze</button>
  </div>
  <div class="row">
    <button class="seg on" id="mirrorBtn" data-i18n="mirror">Mirror</button>
    <button class="seg" id="realBtn" data-i18n="real">Real view</button>
  </div>
  <div id="zoomBox">
    <h3 data-i18n="zoom">Zoom</h3>
    <div class="row" id="zoomRow"></div>
  </div>
  <div id="lookBox">
    <h3 data-i18n="look">Look</h3>
    <div class="row">
      <button class="seg on" id="xrayBtn" data-i18n="glow">Glow</button>
      <button class="seg" id="solidBtn" data-i18n="solid">Solid</button>
    </div>
    <div class="slider"><span data-i18n="brightness">Brightness</span><input type="range" id="bright" min="20" max="200" value="100"></div>
    <div class="row"><button class="btn on" id="fingersBtn" data-i18n="fingers">Finger bones</button></div>
  </div>
  <div id="namesBox">
    <h3 data-i18n="names">Part names</h3>
    <div class="row">
      <button class="seg" id="names0" data-i18n="namesOff">Hidden</button>
      <button class="seg on" id="names1" data-i18n="namesMain">Main</button>
      <button class="seg" id="names2" data-i18n="namesAll">All</button>
    </div>
  </div>
  <div class="slider"><span data-i18n="textSize">Text size</span><input type="range" id="textSize" min="80" max="160" value="100"></div>
  <div class="row"><button class="btn" id="edBtn" data-i18n="changeEdition">Change mode</button></div>
</div>

<nav id="tabs">
  <button id="tabSkel" class="on"><svg class="i"><use href="#i-bone"/></svg><span class="lbl" data-i18n="skeleton">Skeleton</span></button>
  <button id="tabOrg"><svg class="i"><use href="#i-organ"/></svg><span class="lbl" data-i18n="organs">Organs</span></button>
  <button id="tabCirc"><svg class="i"><use href="#i-blood"/></svg><span class="lbl" data-i18n="circulation">Blood</span></button>
</nav>

<div id="dock"></div>

<div id="card" role="dialog" aria-live="polite">
  <button class="x" id="cardClose" data-i18n-aria="close">&#10005;</button>
  <div class="nm" id="cardName"></div>
  <div class="lt" id="cardLatin"></div>
  <div class="ds" id="cardDesc"></div>
  <div id="cardBody"></div>
  <button class="btn primary watch" id="cardWatch"><svg class="i" style="width:16px;height:16px"><use href="#i-play"/></svg><span data-i18n="watch">Watch the lesson</span></button>
</div>

<div id="vdock">
  <div class="vh"><div class="vt" id="vTitle"></div><button class="vx" id="vClose" data-i18n-aria="close">&#10005;</button></div>
  <div class="row" id="vLangs"></div>
  <video id="vPlayer" controls playsinline preload="metadata"></video>
</div>

<div id="mascot"><div id="bubble"></div><img id="mascotImg" src="assets/mascot/sendi-happy.svg" alt="Sendi"></div>
<div id="scrim"></div>
<div id="sheet" role="dialog"></div>

<div id="overlay">
  <div class="wrap" id="step1">
    <h1 id="ovTitle">X-Ray Body Mirror</h1>
    <div class="langsw" id="ovLang"><button data-l="en">English</button><button data-l="ms">Bahasa Melayu</button></div>
    <p class="lead" data-i18n="pickEdition">Choose how you want to play</p>
    <div class="eds">
      <button class="ed kids" data-ed="kids"><div class="art"><img src="assets/mascot/sendi-cheer.svg" alt=""></div>
        <div><b data-i18n="edKids">Kids</b><span data-i18n="edKidsSub"></span></div></button>
      <button class="ed forensic" data-ed="forensic"><div class="art"><svg viewBox="0 0 64 64" width="52" height="52" fill="none" stroke="#f2b134" stroke-width="3" stroke-linecap="round"><circle cx="27" cy="27" r="14"/><path d="M37 37l14 14"/><path d="M21 27h12M27 21v12" stroke="#4fd1e0"/></svg></div>
        <div><b data-i18n="edForensic">Forensic Lab</b><span data-i18n="edForensicSub"></span></div></button>
      <button class="ed explore" data-ed="explore"><div class="art"><svg viewBox="0 0 64 64" width="52" height="52" fill="none" stroke="#6ef2c4" stroke-width="3" stroke-linecap="round"><circle cx="32" cy="14" r="7"/><path d="M32 21v22M20 28h24M24 58l8-15 8 15M22 28l-4 14M42 28l4 14"/></svg></div>
        <div><b data-i18n="edExplore">Explore</b><span data-i18n="edExploreSub"></span></div></button>
    </div>
    <small><span data-i18n="privacy"></span><br><span data-i18n="credit"></span></small>
  </div>
  <div class="wrap hidden" id="step2">
    <div class="edhead" id="edHead"></div>
    <p class="note" id="edNote"></p>
    <div class="modes">
      <button class="primary" id="startCam" data-i18n="startCam">Start camera</button>
      <button id="startPhoto" data-i18n="startPhoto">Use my photo</button>
      <button id="startDemo" data-i18n="startDemo">Play without camera</button>
    </div>
    <p class="note" data-i18n="tipBody"></p>
    <button class="backlink" id="ovBack" data-i18n="back">Back</button>
    <small><span data-i18n="privacy"></span></small>
  </div>
</div>

<script src="data/skeleton-data.js"></script>
<script src="js/util.js"></script>
<script src="js/i18n.js"></script>
<script src="js/parts.js"></script>
<script src="js/parts-ms.js"></script>
<script src="js/lessons.js"></script>
<script src="js/sfx.js"></script>
<script src="js/fx.js"></script>
<script src="js/renderer.js"></script>
<script src="js/pose.js"></script>
<script src="js/labels.js"></script>
<script src="js/editions.js"></script>
<script src="js/kids-data.js"></script>
<script src="js/ed-kids.js"></script>
<script src="js/forensic-data.js"></script>
<script src="js/ed-forensic.js"></script>
<script src="js/app.js"></script>
<script src="js/selftest.js"></script>
</body>
</html>
